<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MANTOI Character Finder</title>
    <script>
      // Suppress opaque third-party cross-origin script errors (e.g. Disqus in sandboxed preview)
      window.onerror = function(message, source, lineno, colno, error) {
        if (message === 'Script error.' || (source && source.indexOf('disqus') !== -1)) {
          return true; // Suppress reporting
        }
        return false;
      };

      window.addEventListener('error', function(event) {
        if (
          event.message === 'Script error.' ||
          (event.filename && event.filename.indexOf('disqus') !== -1) ||
          (event.message && event.message.indexOf('disqus') !== -1)
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason &&
          typeof event.reason.message === 'string' &&
          (event.reason.message.indexOf('Script error') !== -1 || event.reason.message.indexOf('disqus') !== -1)
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script id="dsq-count-scr" src="//mantoi-finder.disqus.com/count.js" async></script>
  </body>
</html>
