<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MANTOI Character Finder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Load Disqus count script safely
      (function() {
        var s = document.createElement('script');
        s.id = 'dsq-count-scr';
        s.src = 'https://mantoi-finder.disqus.com/count.js';
        s.async = true;
        s.onerror = function() {
          console.warn('Disqus count script could not be loaded.');
        };
        (document.head || document.body).appendChild(s);
      })();
    </script>
  </body>
</html>
