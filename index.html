<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MANTOI Character Finder</title>
    <script>
      (function() {
        // Suppress third-party cross-origin script errors (e.g. Disqus in sandboxed preview iframe)
        function shouldSuppress(msg, url, target) {
          if (!msg || msg === 'Script error.') return true;
          if (typeof msg === 'string' && (msg.indexOf('Script error') !== -1 || msg.indexOf('disqus') !== -1)) return true;
          if (url && typeof url === 'string' && url.indexOf('disqus') !== -1) return true;
          if (target && (target.tagName === 'SCRIPT' || (target.src && typeof target.src === 'string' && target.src.indexOf('disqus') !== -1))) return true;
          return false;
        }

        window.addEventListener('error', function(event) {
          if (shouldSuppress(event.message, event.filename, event.target)) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);

        window.onerror = function(message, source, lineno, colno, error) {
          if (shouldSuppress(message, source, null)) {
            return true;
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason && (reason.message || reason);
          if (shouldSuppress(msg, null, null)) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
