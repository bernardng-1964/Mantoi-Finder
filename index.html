<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MANTOI Character Finder</title>
    <script>
      (function() {
        // Suppress third-party cross-origin script errors (e.g., Disqus in sandboxed preview iframe)
        var suppress = function(msg, url) {
          if (!msg || msg === 'Script error.' || (typeof msg === 'string' && (msg.indexOf('Script error') !== -1 || msg.indexOf('disqus') !== -1)) || (url && url.indexOf('disqus') !== -1)) {
            return true;
          }
          return false;
        };

        window.onerror = function(message, source, lineno, colno, error) {
          if (suppress(message, source)) {
            return true;
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          if (suppress(event.message, event.filename)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (!reason || (typeof reason === 'string' && (reason.indexOf('Script error') !== -1 || reason.indexOf('disqus') !== -1)) || (reason && reason.message && typeof reason.message === 'string' && (reason.message.indexOf('Script error') !== -1 || reason.message.indexOf('disqus') !== -1))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script id="dsq-count-scr" src="//mantoi-finder.disqus.com/count.js" async onerror="this.onerror=null;"></script>
  </body>
</html>
